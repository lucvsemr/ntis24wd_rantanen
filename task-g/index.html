<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Information form</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js"></script>
  </head>

  <body>
    <header class="site-header">
      <h1>Registeration page</h1>
    </header>

    <main class="content">
      <!-- Top row split into two blocks -->
      <div class="top-grid">
        <!-- Student info (30%) -->
        <section class="student-info" aria-label="Student information">
          <h2 class="student-info-title">Information</h2>
          <p><span class="student-name">Lucas Rantanen</span></p>
          <p><span class="student-group">NTIS24k</span></p>
        </section>

        <!-- Controls (70%): add course + day marks -->
        <section class="controls" aria-label="Add course row">
          <h2 class="controls-title">Info form</h2>

          <form id="addForm">
            <div class="form-row">
              <label for="name">Name</label>
              <input
                id="name"
                name="name"
                type="text"
                required
                placeholder="ex. Lucas Rantanen"
              />
            </div>
            <p class="error" id="nameError"></p>

            <div class="form-row">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                required
                placeholder="ex. lrantanen188@gmail.com"
              />
            </div>
            <p class="error" id="emailError"></p>

            <div class="form-row">
              <label for="tel">Phone number</label>
              <input
                id="tel"
                name="tel"
                type="tel"
                required
                placeholder="ex. 040 123 4567"
              />
            </div>
            <p class="error" id="telError"></p>

            <div class="form-row">
              <label for="birthDate">Birthdate</label>
              <input
                id="birthDate"
                name="birthDate"
                type="date"
                required
              />
            </div>
            <p class="error" id="birthError"></p>

            <div class="form-row">
              <label
                ><input 
                id="rights" 
                name="terms" 
                type="checkbox" 
                /> I forfeit all rights</label>
            </div>
            <p class="error" id="rightsError"></p>

            <div class="form-row">
              <button id="addRowBtn" type="submit" class="btn">Submit</button>
              <button id="clearBtn" type="reset" class="btn btn-secondary">Clear</button>
            </div>
          </form>
        </section>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table class="table" id="infotable">
          <thead>
            <tr>
              <th>Time</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Birth date</th>
              <th>Rights forfeited</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </body>
</html>
